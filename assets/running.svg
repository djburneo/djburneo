<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="70" viewBox="0 0 800 70">
  <defs>
    <style>
      @keyframes runAcross {
        0% {
          transform: translateX(-80px);
        }
        100% {
          transform: translateX(820px);
        }
      }
      .runner {
        animation: runAcross 6s linear infinite;
      }
    </style>
  </defs>
  <image class="runner" href="1.gif" width="60" height="60" y="5" />
</svg>
